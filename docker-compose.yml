services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taxbot
      POSTGRES_PASSWORD: taxbot_dev
      POSTGRES_DB: taxbot_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    depends_on:
      - db
      - ollama
    environment:
      DATABASE_URL: postgresql://taxbot:taxbot_dev@db:5432/taxbot_db
      JWT_SECRET: f1c3265d19e54c3fe7aa47efda4ad1e148a6f38b11eae7ca5a95121a67b5e1d524327c222623caddf1b70a0e7f1529e0
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.1:8b
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - '4000:4000'
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm run dev

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    depends_on:
      - server
    ports:
      - '5173:5173'
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm run dev -- --host

  ollama:
    image: ollama/ollama:latest
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama

volumes:
  pgdata:
  ollama_data:
